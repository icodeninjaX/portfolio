<!doctype html>
<!--
  PlantPal (Garden) motion-graphics demo: "a field guide to Garden". Unlike the
  ATLAS and Coop-Tracker videos there are no scene fades: it is one continuous
  camera move up a stem that draws itself, with each screen pressed onto the
  paper like a herbarium specimen, then a pull-back that reveals the whole
  plant. Same contract: render(t), DURATION, POSTER_AT; preview with ?play.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garden demo</title>
<style>
  @font-face { font-family: "Instrument Serif"; src: url("../../app/fonts/instrument-serif.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; src: url("../../app/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }
  @font-face { font-family: "Inter"; src: url("../../app/fonts/inter-var.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("../../app/fonts/jetbrains-mono-var.woff2") format("woff2"); font-weight: 100 800; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f1ebdb; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #1e3527; font-family: "Inter", sans-serif;
    background: radial-gradient(ellipse 80% 70% at 50% 45%, #f6f1e3, #ebe3cf 100%); }
  /* Paper grain over everything. */
  #grain { position: absolute; inset: 0; pointer-events: none; z-index: 50; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .22 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 49; box-shadow: inset 0 0 220px #b9a98266; }

  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 4200px; transform-origin: 0 0; }
  #world svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .mono { font-family: "JetBrains Mono", monospace; letter-spacing: .18em; text-transform: uppercase; }

  /* Pressed specimens */
  .card { position: absolute; width: 344px; padding: 20px 20px 22px; background: #fbf8f0; box-shadow: 0 1px 0 #d9cfb6, 0 24px 40px -26px #5b4a2a88; transform-origin: 50% 0; }
  .card img { display: block; width: 100%; border: 1px solid #1e352733; }
  .card .tag { margin-top: 12px; font: 13px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #8a7a58; }
  .tape { position: absolute; width: 104px; height: 30px; background: #e9dcb8c4; box-shadow: 0 1px 2px #6b5a3022; }
  .tape.a { left: -26px; top: -10px; transform: rotate(-32deg); }
  .tape.b { right: -26px; top: -10px; transform: rotate(28deg); }
  .label { position: absolute; width: 520px; }
  .label .k { font-size: 16px; color: #b5562f; }
  .label .h { margin-top: 16px; font: italic 400 62px/1.05 "Instrument Serif", serif; color: #1e3527; min-height: 66px; }
  .label .b { margin-top: 16px; font-size: 24px; line-height: 1.55; color: #4f5d4c; min-height: 76px; }
  .label .rule { margin-top: 22px; height: 1px; background: #1e352733; transform-origin: 0 50%; }

  /* Intro + end titles (screen space) */
  #intro { position: absolute; left: 0; right: 0; top: 230px; text-align: center; z-index: 20; }
  #intro .k { font-size: 18px; color: #b5562f; }
  #intro h1 { margin-top: 26px; font: 400 190px/0.9 "Instrument Serif", serif; letter-spacing: -.02em; }
  #intro h1 span { display: inline-block; }
  #intro p { margin-top: 30px; font: italic 400 38px "Instrument Serif", serif; color: #4f5d4c; }
  #end { position: absolute; left: 980px; top: 270px; width: 820px; z-index: 20; }
  #end .k { font-size: 17px; color: #b5562f; }
  #end h2 { margin-top: 22px; font: 400 150px/0.9 "Instrument Serif", serif; letter-spacing: -.02em; }
  #end .line { margin-top: 24px; font: italic 400 50px/1.15 "Instrument Serif", serif; color: #2f5a3c; }
  #end .stack { margin-top: 40px; font-size: 16px; color: #8a7a58; }
  #end .by { margin-top: 44px; font-size: 25px; color: #1e3527; }
  #end .url { margin-top: 10px; font: 19px "JetBrains Mono", monospace; color: #b5562f; }
  #fade { position: absolute; inset: 0; background: #f1ebdb; pointer-events: none; z-index: 60; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <svg width="1920" height="4200" id="plant">
      <path id="soil" d="M560 3962 C 760 3950, 1160 3974, 1360 3960" fill="none" stroke="#1e3527" stroke-width="3" stroke-linecap="round"/>
      <ellipse id="seed" cx="960" cy="3946" rx="18" ry="12" fill="#7b5a36"/>
      <path id="stem" fill="none" stroke="#2f5a3c" stroke-width="7" stroke-linecap="round"/>
      <g id="branches"></g>
      <g id="flower" transform="translate(0 0)"></g>
    </svg>
    <div id="cards"></div>
  </div>

  <div id="intro">
    <div class="k mono">A field guide to</div>
    <h1 id="title"></h1>
    <p>PlantPal, the plant-care app: logged, scheduled, looked after.</p>
  </div>

  <div id="end">
    <div class="k mono">The whole garden</div>
    <h2>Garden</h2>
    <div class="line">A little care, every day.</div>
    <div class="stack mono">HTML · CSS · JavaScript · HTMX · MySQL</div>
    <div class="by">Designed &amp; built by Keith Vergara</div>
    <div class="url">kdv-garden.ct.ws</div>
  </div>

  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="fade"></div>
</div>

<script>
const SPECIMENS = [
  ["login", "Log in", "Welcome back.", "A calm sign-in, then straight to your garden."],
  ["today", "Today", "A little care, every day.", "What to water and what to feed today, at a glance."],
  ["plants", "Plants", "Every leaf, catalogued.", "The collection, growing and retired, searchable by name or species."],
  ["calendar", "Calendar", "Care, on schedule.", "The month's watering and feeding as an agenda, with planting guidance."],
  ["library", "Library", "87 care guides.", "Find what thrives in your space, by plant type and experience."],
  ["activity", "Activity", "Every watering, logged.", "A care history for each plant, filterable by type and date."],
];
const NODE_Y = [3500, 2940, 2380, 1820, 1260, 700];
const NODE_T = NODE_Y.map((_, k) => 5.2 + 3.7 * k);   // when the camera arrives at each node
const TOP_Y = 300, BLOOM_T = 26.6, ZOOM = [28.4, 31.2], DURATION = 36;

const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const out = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

// Stem: a gentle S-curve from the seed up to the bloom.
const stemX = (y) => 960 + 110 * Math.sin((3900 - y) / 520) * (y < 3820 ? 1 : (3900 - y) / 80);
const samples = [];
for (let y = 3940; y >= TOP_Y; y -= 10) samples.push([stemX(y), y]);
$("stem").setAttribute("d", "M" + samples.map(([x, y]) => `${x.toFixed(1)},${y}`).join(" L"));
const STEM_LEN = $("stem").getTotalLength();
const lenAtY = (y) => STEM_LEN * clamp((3940 - y) / (3940 - TOP_Y));
$("stem").style.strokeDasharray = STEM_LEN;

// Title letters for the intro reveal.
"Garden".split("").forEach((ch) => { const s = document.createElement("span"); s.textContent = ch; $("title").appendChild(s); });

// Each node: a branch, a leaf, a pressed card and a typed label on the far side of the stem.
const nodes = SPECIMENS.map(([slug, name, head, body], k) => {
  const y = NODE_Y[k], sx = stemX(y), left = k % 2 === 0;
  const cardX = left ? sx - 640 : sx + 300, cardY = y - 340;
  const g = svgEl("g", {}, $("branches"));
  const bx = left ? cardX + 344 : cardX;           // branch meets the card's inner edge
  const branch = svgEl("path", { d: `M${sx},${y + 20} C ${lerp(sx, bx, .45)},${y + 30} ${lerp(sx, bx, .6)},${y - 80} ${bx},${y - 90}`, fill: "none", stroke: "#2f5a3c", "stroke-width": 4, "stroke-linecap": "round" }, g);
  const blen = branch.getTotalLength(); branch.style.strokeDasharray = blen; branch.style.strokeDashoffset = blen;
  const dir = left ? 1 : -1;
  const leaf = svgEl("path", { d: "M0,0 C 30,-34 96,-40 140,-6 C 96,26 34,24 0,0 Z", fill: "#7fa260", stroke: "#2f5a3c", "stroke-width": 3 }, g);
  const vein = svgEl("path", { d: "M6,-1 C 50,-10 96,-12 132,-6", fill: "none", stroke: "#2f5a3c", "stroke-width": 2, opacity: .7 }, g);
  const leafAt = `translate(${sx} ${y + 10}) scale(${dir} 1) rotate(${-20})`;
  const card = document.createElement("div");
  card.className = "card";
  card.style.left = `${cardX}px`; card.style.top = `${cardY}px`;
  card.innerHTML = `<i class="tape a"></i><i class="tape b"></i><img src="../../public/images/plantpal-mobile-app-${slug}.webp" alt=""><div class="tag">Fig. ${String(k + 1).padStart(2, "0")} · ${name}</div>`;
  $("cards").appendChild(card);
  const label = document.createElement("div");
  label.className = "label";
  label.style.left = `${left ? sx + 200 : sx - 720}px`; label.style.top = `${y - 140}px`;
  label.innerHTML = `<div class="k mono">Specimen ${String(k + 1).padStart(2, "0")} · ${name}</div><div class="h"></div><div class="b"></div><div class="rule"></div>`;
  $("cards").appendChild(label);
  return { k, y, head, body, branch, blen, leaf, vein, leafAt, card, label, tilt: [-2.4, 1.8, -1.2, 2.2, -1.8, 1.4][k] };
});

// Bloom at the top: five petals around a seed head.
const flower = $("flower");
const fx = stemX(TOP_Y), fy = TOP_Y - 10;
const petals = [0, 72, 144, 216, 288].map((a) => svgEl("ellipse", { cx: 0, cy: -46, rx: 30, ry: 50, fill: "#e7a77f", stroke: "#b5562f", "stroke-width": 3, transform: `translate(${fx} ${fy}) rotate(${a}) scale(0)` }, flower));
const heart = svgEl("circle", { cx: fx, cy: fy, r: 0, fill: "#d9a441", stroke: "#7b5a36", "stroke-width": 3 }, flower);

// Stem tip height over time: rise to each node, rest there while its specimen is pressed.
function tipY(t) {
  if (t < NODE_T[0] - 1.7) return lerp(3940, 3700, ease(prog(t, 3.0, NODE_T[0] - 1.7)));
  let y = 3700;
  for (let k = 0; k < NODE_Y.length; k++) {
    const a = NODE_T[k] - 1.7, b = NODE_T[k] - 0.3;
    if (t >= a) y = lerp(k === 0 ? 3700 : NODE_Y[k - 1], NODE_Y[k], ease(prog(t, a, b)));
  }
  if (t >= BLOOM_T - 1.4) y = lerp(NODE_Y[5], TOP_Y, ease(prog(t, BLOOM_T - 1.4, BLOOM_T)));
  return y;
}

const typed = (s, t, a, b) => s.slice(0, Math.round(s.length * prog(t, a, b)));

function render(t) {
  const tip = tipY(t);
  $("stem").style.strokeDashoffset = STEM_LEN - lenAtY(tip);
  $("seed").setAttribute("ry", 12 - 4 * prog(t, 3, 4));
  $("soil").style.strokeDasharray = 900; $("soil").style.strokeDashoffset = 900 * (1 - ease(prog(t, .4, 1.8)));

  // Specimens.
  nodes.forEach((n) => {
    const T = NODE_T[n.k];
    n.branch.style.strokeDashoffset = n.blen * (1 - ease(prog(t, T - .55, T + .05)));
    const lf = clamp(back(prog(t, T - .9, T - .1)), 0, 1.15);
    n.leaf.setAttribute("transform", `${n.leafAt} scale(${lf})`);
    n.vein.setAttribute("transform", `${n.leafAt} scale(${lf})`);
    const c = out(prog(t, T - .2, T + .5));
    n.card.style.opacity = c;
    n.card.style.transform = `translateY(${(1 - c) * -40}px) rotate(${n.tilt + (1 - c) * 6}deg) scale(${1.06 - .06 * c})`;
    n.card.querySelectorAll(".tape").forEach((tp, i) => { tp.style.opacity = out(prog(t, T + .35 + i * .1, T + .6 + i * .1)); });
    const L = n.label;
    L.querySelector(".k").style.opacity = out(prog(t, T + .1, T + .5));
    L.querySelector(".h").textContent = typed(n.head, t, T + .25, T + .9);
    L.querySelector(".b").textContent = typed(n.body, t, T + .75, T + 1.65);
    L.querySelector(".rule").style.transform = `scaleX(${ease(prog(t, T + .4, T + 1.3))})`;
  });

  // Bloom.
  const bl = (i) => clamp(back(prog(t, BLOOM_T - .1 + i * .12, BLOOM_T + .7 + i * .12)), 0, 1.15);
  petals.forEach((p, i) => p.setAttribute("transform", `translate(${fx} ${fy}) rotate(${i * 72 + 8 * Math.sin(t)}) scale(${bl(i)})`));
  heart.setAttribute("r", 26 * clamp(back(prog(t, BLOOM_T + .5, BLOOM_T + 1.2)), 0, 1.2));

  // Camera: follows the tip (never below the opening frame), then pulls back to the whole plant.
  const follow = { x: 960, y: Math.min(3700, tip), s: 1 };
  if (t > BLOOM_T) follow.y = TOP_Y + 120;
  const z = ease(prog(t, ZOOM[0], ZOOM[1]));
  const s = lerp(1, .245, z);
  const camX = lerp(follow.x, 960 + 440 / .245, z), camY = lerp(follow.y, 2150, z);
  $("world").style.transform = `translate(${960 - camX * s}px, ${540 - camY * s}px) scale(${s})`;

  // Intro title, then end text beside the full plant.
  const intro = 1 - ease(prog(t, 3.0, 3.9));
  $("intro").style.opacity = intro;
  $("intro").style.transform = `translateY(${-60 * (1 - intro)}px)`;
  $("intro").querySelector(".k").style.opacity = out(prog(t, .5, 1.2));
  $("title").querySelectorAll("span").forEach((sp, i) => { const v = out(prog(t, .8 + i * .1, 1.5 + i * .1)); sp.style.opacity = v; sp.style.transform = `translateY(${(1 - v) * 50}px)`; });
  $("intro").querySelector("p").style.opacity = out(prog(t, 1.7, 2.4));
  $("end").querySelectorAll(".k,h2,.line,.stack,.by,.url").forEach((el, i) => { const v = out(prog(t, 30.4 + i * .22, 31.3 + i * .22)); el.style.opacity = v; el.style.transform = `translateX(${(1 - v) * 40}px)`; });

  $("fade").style.opacity = Math.max(1 - prog(t, 0, .5), prog(t, DURATION - .8, DURATION));
}

window.DURATION = DURATION;
window.POSTER_AT = 9.6; // the Today specimen, pressed and labelled
window.render = render;
render(0);
if (location.search.includes("play")) {
  const start = performance.now();
  const loop = () => { render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
